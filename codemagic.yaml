      body: const Center(
        child: Column(
          mainAxisAlignment: MainAxisAlignment.center,
          children: [
            Icon(Icons.add_photo_alternate, size: 80, color: PulsePinTheme.primary),
            SizedBox(height: 20),
            Text('Tap to upload video or photo', style: TextStyle(fontSize: 18)),
            SizedBox(height: 30),
            // Tags, links, board selection coming next
          ],
        ),
      ),
    );
  }
}

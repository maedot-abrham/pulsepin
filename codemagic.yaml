name: pulsepin
description: Scroll. Save. Become. — TikTok + Pinterest Fusion
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.24.0
  firebase_auth: ^4.15.0
  cloud_firestore: ^4.13.0
  firebase_storage: ^11.5.0
  provider: ^6.1.1
  image_picker: ^1.0.4
  video_player: ^2.8.1
  cached_network_image: ^3.3.0
  flutter_staggered_grid_view: ^0.7.0
  firebase_app_check: ^0.2.1

flutter:
  uses-material-design: true
import 'package:flutter/material.dart';

class PulsePinTheme {
  static const Color primary = Color(0xFF7B2FFD);    // Electric Violet
  static const Color secondary = Color(0xFF00E0C6);  // Glow Teal
  static const Color background = Color(0xFF0F0F1A); // Deep Midnight
  static const Color surface = Color(0xFF1A1A2E);
  static const Color text = Color(0xFFF8F7FC);       // Soft White
  static const Color accent = Color(0xFFFF2D92);

  static ThemeData dark = ThemeData(
    brightness: Brightness.dark,
    scaffoldBackgroundColor: background,
    primaryColor: primary,
    colorScheme: const ColorScheme.dark(
      primary: primary,
      secondary: secondary,
      surface: surface,
    ),
    textTheme: const TextTheme(
      bodyLarge: TextStyle(color: text, fontSize: 16),
      bodyMedium: TextStyle(color: text, fontSize: 14),
      titleLarge: TextStyle(color: text, fontSize: 22, fontWeight: FontWeight.bold),
    ),
  );
}
import 'package:flutter/material.dart';
import 'package:firebase_core/firebase_core.dart';
import 'config/theme.dart';
import 'screens/feed_screen.dart';
import 'screens/boards_screen.dart';
import 'screens/create_screen.dart';
import 'screens/search_screen.dart';
import 'screens/profile_screen.dart';

void main() async {
  WidgetsFlutterBinding.ensureInitialized();
  await Firebase.initializeApp(); // Connects your cloud backend
  runApp(const PulsePinApp());
}

class PulsePinApp extends StatelessWidget {
  const PulsePinApp({super.key});

  @override
  Widget build(BuildContext context) {
    return MaterialApp(
      title: 'PulsePin',
      theme: PulsePinTheme.dark,
      home: const MainScreen(),
      debugShowCheckedModeBanner: false,
    );
  }
}

class MainScreen extends StatefulWidget {
  const MainScreen({super.key});

  @override
  State<MainScreen> createState() => _MainScreenState();
}

class _MainScreenState extends State<MainScreen> {
  int _selectedIndex = 0;

  final List<Widget> _screens = const [
    FeedScreen(),      // 🎞️ Feed
    BoardsScreen(),    // 📌 Boards
    CreateScreen(),    // 🎨 Create
    SearchScreen(),    // 🔍 Explore
    ProfileScreen(),   // 👤 Profile
  ];

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      body: _screens[_selectedIndex],
      bottomNavigationBar: NavigationBar(
        selectedIndex: _selectedIndex,
        onDestinationSelected: (i) => setState(() => _selectedIndex = i),
        backgroundColor: PulsePinTheme.surface,
        indicatorColor: PulsePinTheme.primary.withOpacity(0.3),
        destinations: const [
          NavigationDestination(icon: Icon(Icons.whatshot), label: 'Pulse'),
          NavigationDestination(icon: Icon(Icons.bookmark), label: 'Boards'),
          NavigationDestination(icon: Icon(Icons.add_circle, size: 35), label: 'Create'),
          NavigationDestination(icon: Icon(Icons.explore), label: 'Explore'),
          NavigationDestination(icon: Icon(Icons.person), label: 'Profile'),
        ],
      ),
    );
  }
}
import 'package:flutter/material.dart';
import '../config/theme.dart';

class FeedScreen extends StatelessWidget {
  const FeedScreen({super.key});

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      backgroundColor: PulsePinTheme.background,
      body: PageView.builder(
        scrollDirection: Axis.vertical, // Vertical scroll — TikTok style
        itemCount: 10,
        itemBuilder: (context, index) {
          return _buildPostCard(index);
        },
      ),
    );
  }

  Widget _buildPostCard(int index) {
    return Container(
      width: double.infinity,
      height: double.infinity,
      decoration: BoxDecoration(
        gradient: LinearGradient(
          begin: Alignment.topCenter,
          end: Alignment.bottomCenter,
          colors: [
            PulsePinTheme.primary.withOpacity(0.5),
            PulsePinTheme.secondary.withOpacity(0.3),
          ],
        ),
      ),
      child: Stack(
        children: [
          // Content placeholder
          const Center(child: Text('Post $index — Video/Image', style: TextStyle(fontSize: 18))),
          
          // Right Side Actions
          Positioned(
            right: 15,
            bottom: 100,
            child: Column(
              children: [
                _buildActionButton(Icons.favorite, '12.5K'),
                const SizedBox(height: 20),
                _buildActionButton(Icons.comment, '892'),
                const SizedBox(height: 20),
                _buildActionButton(Icons.bookmark_add, 'Save'), // 📌 Save to Board
                const SizedBox(height: 20),
                _buildActionButton(Icons.share, 'Share'),
              ],
            ),
          ),

          // Bottom Info
          const Positioned(
            left: 15,
            bottom: 80,
            child: Column(
              crossAxisAlignment: CrossAxisAlignment.start,
              children: [
                Text('@creator_name', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 16)),
                SizedBox(height: 8),
                Text('Beautiful idea — save to your board! ✨ #inspiration #design'),
              ],
            ),
          ),
        ],
      ),
    );
  }

  Widget _buildActionButton(IconData icon, String label) {
    return Column(
      children: [
        Icon(icon, color: Colors.white, size: 28),
        const SizedBox(height: 4),
        Text(label, style: const TextStyle(color: Colors.white, fontSize: 12)),
      ],
    );
  }
}
import 'package:flutter/material.dart';
import 'package:flutter_staggered_grid_view/flutter_staggered_grid_view.dart';
import '../config/theme.dart';

class BoardsScreen extends StatelessWidget {
  const BoardsScreen({super.key});

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      backgroundColor: PulsePinTheme.background,
      appBar: AppBar(
        title: const Text('Your Boards'),
        backgroundColor: Colors.transparent,
        actions: [
          IconButton(icon: const Icon(Icons.add), onPressed: () {}),
        ],
      ),
      body: Padding(
        padding: const EdgeInsets.all(12),
        child: MasonryGridView.count(
          crossAxisCount: 2,
          mainAxisSpacing: 12,
          crossAxisSpacing: 12,
          itemCount: 8,
          itemBuilder: (context, index) {
            return Container(
              decoration: BoxDecoration(
                color: PulsePinTheme.surface,
                borderRadius: BorderRadius.circular(16),
              ),
              padding: const EdgeInsets.all(12),
              child: Column(
                crossAxisAlignment: CrossAxisAlignment.start,
                children: [
                  Container(
                    height: 80 + (index % 3) * 30,
                    decoration: BoxDecoration(
                      color: [PulsePinTheme.primary, PulsePinTheme.secondary, PulsePinTheme.accent][index % 3].withOpacity(0.6),
                      borderRadius: BorderRadius.circular(12),
                    ),
                  ),
                  const SizedBox(height: 10),
                  Text('Board Name ${index + 1}', style: const TextStyle(fontWeight: FontWeight.bold)),
                  const SizedBox(height: 4),
                  Text('${10 + index * 5} pins', style: TextStyle(color: Colors.grey[400], fontSize: 12)),
                ],
              ),
            );
          },
        ),
      ),
    );
  }
}
import 'package:flutter/material.dart';

workflows:
  android:
    name: Android Build
    max_build_duration: 30
    instance_type: standard
    environment:
      flutter: 3.24.0
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
